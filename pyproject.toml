[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-study-mentor"
version = "0.1.0"
description = "RAG tutor for Computer Science learning: multi-source ingestion, cited answers, tutoring tools and a LeetCode mentor."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pypdf>=4.0",
    "fonttools>=4.0",  # lets pypdf decode more embedded fonts (fewer garbled PDF pages)
    "python-dotenv>=1.0",
    "requests>=2.31",
    "google-genai>=1.0",
]

[project.optional-dependencies]
# Semantic retrieval. Without it the engine falls back to keyword overlap.
embeddings = [
    "sentence-transformers>=3.0",
]
# Optional ANN/flat index backend, see VECTOR_BACKEND in README. Cannot be used in the
# same process as torch on macOS (OpenMP clash), so it is not part of `embeddings` or `all`.
faiss = ["faiss-cpu>=1.8"]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
]
sources = [
    "youtube-transcript-api>=0.6.2,<1.0",  # code uses YouTubeTranscriptApi.get_transcript (removed in 1.x)
    "beautifulsoup4>=4.12",
    "readability-lxml>=0.8.1",
    "gitpython>=3.1",
    "openai>=1.43",  # audio transcription (Whisper)
]
leetcode = [
    "pandas>=2.0",
    "huggingface_hub>=0.23",
    "kaggle>=1.6",
]
math = ["sympy>=1.12"]
export = [
    "reportlab>=4.0",
    "markdown>=3.5",
]
# Anki package (.apkg) export for flashcards; CSV export needs nothing extra.
anki = ["genanki>=0.13"]
# Keep the index and study database in S3 (see backend/cloud_sync.py).
aws = ["boto3>=1.34"]
# The agentic answer workflow (backend/agent.py). Without it the API still runs; that one endpoint answers 503.
agent = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
]
# The MCP server (backend/mcp_server.py): the same study tools, for Claude Desktop, Cursor and other MCP clients.
mcp = ["mcp>=2,<3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",  # FastAPI TestClient
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
all = [
    "ai-study-mentor[embeddings,api,sources,leetcode,math,export,anki,aws,agent,mcp]",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "docs"]

[tool.ruff.lint]
# Lenient start: real bugs only. Tighten in later phases.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E701", "E702",  # one-line compound statements are used in places
    "E731",          # lambda assignment
]

[tool.ruff.lint.per-file-ignores]
# These entry points adjust sys.path before importing project modules.
"scripts/**" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
files = ["backend"]
