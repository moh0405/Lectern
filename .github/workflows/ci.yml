name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: "Install (no torch or faiss; tests use the keyword fallback)"
        run: pip install -e ".[api,sources,leetcode,math,export,dev]"
      - name: Lint
        run: ruff check .
      - name: "Type check (non-blocking while types are cleaned up)"
        run: mypy
        continue-on-error: true
      - name: Tests
        run: pytest
