name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: "Install (no torch or faiss; tests use the keyword fallback)"
        run: pip install -e ".[api,sources,leetcode,math,export,faiss,agent,mcp,dev]"
      - name: Lint
        run: ruff check .
      - name: "Type check (non-blocking while types are cleaned up)"
        run: mypy
        continue-on-error: true
      - name: Tests
        run: pytest
      - name: OpenAPI schema is up to date
        if: matrix.python-version == '3.12'
        run: python scripts/export_openapi.py --check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Generated API types match openapi.json
        run: |
          npm run client:generate
          git diff --exit-code packages/api-client/src/schema.d.ts
      - run: npm run client:typecheck
      - run: npm run client:test
      - run: npm run web:typecheck
      - run: npm run web:lint
      - run: npm run web:test
      - run: npm run web:build

  e2e:
    # Real browser + real API (scripted model, temporary storage): upload, index, ask, cited answer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[api,sources,leetcode,math,export,agent,mcp]"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Build the web app against the e2e API address (NEXT_PUBLIC_* is inlined at build time)
        run: npm run web:build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8100
      - run: npx playwright test
        working-directory: apps/web
        env:
          CI: "true"
      - name: Public-demo mode (browser-stored flashcards and LeetCode progress)
        run: npx playwright test -c playwright.demo.config.ts
        working-directory: apps/web
        env:
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
